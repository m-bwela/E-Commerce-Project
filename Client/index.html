<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />

    <!-- ── Primary SEO ─────────────────────────────────────────────── -->
    <title>GenZiiShop — Curated Luxury Fashion</title>
    <meta name="description" content="Discover premium fashion, footwear and accessories curated for those who appreciate the finest things. Shop men's, women's and kids' collections at GenZiiShop." />
    <meta name="keywords" content="luxury fashion, shoes, footwear, accessories, men fashion, women fashion, kids fashion, GenZiiShop, Kenya online shop" />
    <meta name="author" content="GenZiiShop" />
    <meta name="robots" content="index, follow" />

    <!-- ── Theme color (Android Chrome address bar + browser UI) ────── -->
    <meta name="theme-color" content="#0a0a0f" />

    <!-- ── Favicon ───────────────────────────────────────────────────── -->
    <link rel="icon" type="image/png" href="/web-app-manifest-192x192.png" />
    <link rel="apple-touch-icon" href="/web-app-manifest-512x512.png" />

    <!-- ── PWA Manifest ───────────────────────────────────────────────── -->
    <link rel="manifest" href="/manifest.json" />

    <!-- ── Open Graph (WhatsApp, Facebook, LinkedIn link previews) ──── -->
    <meta property="og:type" content="website" />
    <meta property="og:site_name" content="GenZiiShop" />
    <meta property="og:title" content="GenZiiShop — Curated Luxury Fashion" />
    <meta property="og:description" content="Premium fashion, footwear and accessories curated for those who appreciate the finest things." />
    <meta property="og:image" content="https://e-commerce-project-liard-theta.vercel.app/og-image.svg" />
    <meta property="og:url" content="https://e-commerce-project-liard-theta.vercel.app" />

    <!-- ── Twitter / X Card ──────────────────────────────────────────── -->
    <meta name="twitter:card" content="summary" />
    <meta name="twitter:title" content="GenZiiShop — Curated Luxury Fashion" />
    <meta name="twitter:description" content="Premium fashion and accessories. Shop the finest collections." />
    <meta name="twitter:image" content="https://e-commerce-project-liard-theta.vercel.app/og-image.svg" />

    <!-- ── Preconnect: start DNS + TLS to Google Fonts early ─────────── -->
    <link rel="preconnect" href="https://fonts.googleapis.com" />
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
    <link href="https://fonts.googleapis.com/css2?family=Playfair+Display:wght@400;600;700&family=DM+Sans:wght@300;400;500;600&display=swap" rel="stylesheet" />

    <!-- ── Dark-mode flash prevention ────────────────────────────────── -->
    <!-- Sets background before React mounts so there is no white flash -->
    <style>html,body{background:#0a0a0f;margin:0}</style>
  </head>
  <body>
    <div id="root"></div>
    <script type="module" src="/src/main.jsx"></script>
  </body>
</html>
